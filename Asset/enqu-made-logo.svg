<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" role="img" aria-labelledby="title desc">
  <title id="title">ENQU MADE</title>
  <desc id="desc">Ethiopian artisan marketplace — handcrafted art, culture, and creativity</desc>
  <defs>
    <linearGradient id="fieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="threadGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Emblem -->
  <g transform="translate(8 8)" filter="url(#softShadow)">
    <!-- Shield background -->
    <path d="M30 2 C16 2 4 14 4 28 L4 60 C4 74 14 84 28 84 L30 84 L32 84 C46 84 56 74 56 60 L56 28 C56 14 44 2 30 2 Z" fill="url(#fieldGrad)"/>
    <!-- Inner accent -->
    <path d="M30 6 C24 6 12 16 12 26 L12 52 C12 64 20 72 28 72 L32 72 C40 72 48 64 48 52 L48 26 C48 16 36 6 30 6 Z" fill="none" stroke="#FBBF24" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Jebena (coffee pot) icon -->
    <g transform="translate(6 10)">
      <!-- Pot body -->
      <path d="M10 24 C6 24 4 28 4 34 L4 46 C4 52 10 58 16 58 L24 58 C30 58 36 52 36 46 L36 34 C36 28 34 24 30 24 Z" fill="#F59E0B"/>
      <!-- Neck -->
      <path d="M14 20 C12 20 10 18 10 16 L10 12 C10 8 14 4 18 4 L22 4 C26 4 30 8 30 12 L30 16 C30 18 28 20 26 20 Z" fill="#374151"/>
      <!-- Handle -->
      <path d="M34 30 C36 30 38 32 38 36 L38 44 C38 48 34 52 30 52 C26 52 22 48 22 44 L22 36 C22 32 24 30 26 30 Z" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
      <!-- Spout -->
      <path d="M2 34 C-2 34 -4 32 -4 30 L-4 24 C-4 20 -2 18 2 18 L6 18 C10 18 12 20 12 24 L12 30 C12 34 10 36 6 36 Z" fill="#EF4444"/>
      <!-- Decorative bands -->
      <path d="M4 40 L36 40" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M6 32 L34 32" stroke="#EF4444" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    </g>
    
    <!-- Ethiopian cross motif -->
    <g transform="translate(34 6)">
      <path d="M8 2v20 M18 2v20 M2 12h16 M2 22h16" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="10" cy="10" r="2" fill="#EF4444"/>
      <circle cx="10" cy="20" r="2" fill="#EF4444"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="128" y="46" font-family="'Playfair Display', 'DM Sans', Georgia, serif" font-size="38" font-weight="700" letter-spacing="0.5">
    <tspan x="128" y="46" fill="#1B2A4A">ENQU</tspan>
    <tspan x="242" y="46" dx="8" fill="#F59E0B">MADE</tspan>
  </text>

  <!-- Tagline -->
  <text x="128" y="74" fill="#6B7280" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2">
    ETHIOPIAN ARTISAN MARKETPLACE
  </text>

  <!-- Decorative underline -->
  <path d="M128 82h90" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
</svg>
